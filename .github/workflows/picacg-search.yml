name: Picacg search checks
on:
  push:
    branches: [codex/picacg-multi-tag-search]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/network/picacg_network/search_filters.dart lib/pages/picacg/search_options.dart test/picacg_*.dart
      - name: Analyze changed code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/network/picacg_network/search_filters.dart lib/pages/picacg/search_options.dart lib/pages/pre_search_page.dart lib/pages/search_result_page.dart lib/comic_source/built_in/picacg.dart lib/network/picacg_network/methods.dart lib/components/components.dart test/picacg_search_filters_test.dart test/picacg_search_options_test.dart test/picacg_filtered_pagination_test.dart
      - name: Test native search options and pagination
        run: flutter test --no-pub test/picacg_search_filters_test.dart test/picacg_search_options_test.dart test/picacg_filtered_pagination_test.dart
